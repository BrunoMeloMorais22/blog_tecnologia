<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    
<main class="admin-container">

    <header class="admin-header">
        <div>
            <h1>Painel administrativo</h1>
            <p>Bem-vindo ao gerenciamento do DevBlog.</p>
        </div>

        <span class="admin-badge">ADMIN</span>
    </header>

    <p class="admin-section-title">Visão geral</p>

    <section class="admin-stats">

        <article class="stat-card posts">
            <div class="stat-icon">▤</div>
            <p class="stat-label">Total de posts</p>
            <h2 id="qtd_post">0</h2>
            <p class="stat-description">
                Publicações cadastradas
            </p>
        </article>

        <article class="stat-card users">
            <div class="stat-icon">♙</div>
            <p class="stat-label">Total de usuários</p>
            <h2 id="qtd_usuarios">0</h2>
            <p class="stat-description">
                Contas cadastradas
            </p>
        </article>

    </section>
</main>
    <script src="../js/admin.js"></script>
</body>
</html>

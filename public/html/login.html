<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<body>

    <div class="form-container">

        <form id="loginFormulario">

            <h1 data-i18n="login.titulo"> Faça seu login</h1>

            <div class="input-group">
                <label for="email" data-i18n="login.email">Email</label>
                <input type="email" id="email" name="email" placeholder="Digite seu email..." required
                >
            </div>

            <div class="input-group">
                <label for="senha" data-i18n="login.senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite uma senha..." required>
            </div>

            <button type="submit" data-i18n="login.entrar">
                Fazer login
            </button>   <br><br>

            <div class="links-extras">
                <a href="/cadastro" data-i18n="login.cadastro">Não tem uma conta? Fazer cadastro</a> | <a href="" data-i18n="login.esqueci_senha">Esqueci minha senha</a>
            </div> <br>

            <div id="mensagem"></div>
        </form>

    </div>
    <script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
    <script src="../js/idioma.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu perfil | DevBlog</title>

    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>

    <main class="pagina-perfil">
        <header class="cabecalho">
            <div>
                <h1>Meu perfil</h1>
                <p>Gerencie suas informações e acompanhe sua atividade</p>
            </div>

            <button class="botao-editar" onclick="alternarEdicaoPerfil()" type="button">✎ Editar perfil</button>
            
        </header>
        <div class="layout-perfil">

            <div class="coluna-principal">

                <section class="card perfil-card">

                    <div class="banner-perfil"></div>

                    <div class="dados-perfil">

                        <div class="avatar-container">
                            <img
                                src="../img/fundojpg.jpg"
                                alt="Foto do perfil"
                                class="avatar"
                            >
                            <span class="status-online"></span>
                        </div>

                        <div class="perfil-texto">
                            <h2>Desenvolvedor</h2>
                            <a href="#">@desenvolvedor.dev</a>

                            <input type="text" id="inputDescricao" hidden placeholder="Conte sobre você">

                            <p id="descricao">
                                
                            </p>

                            <div class="perfil-meta">
                                <span id="membro_desde">▣ Membro desde jan. 2024</span>
                                <span>⌖ Brasil</span>
                            </div>
                        </div>

                    </div>
                    <div class="estatisticas">

                        <div class="estatistica">
                            <span class="estatistica-icone">▤</span>
                            <div>
                                <strong id="qtd_post">24</strong>
                                <span>Posts</span>
                            </div>
                        </div>

                        <div class="estatistica">
                            <span class="estatistica-icone">◎</span>
                            <div>
                                <strong>1.2k</strong>
                                <span>Visualizações</span>
                            </div>
                        </div>

                        <div class="estatistica">
                            <span class="estatistica-icone">♡</span>
                            <div>
                                <strong>312</strong>
                                <span>Curtidas</span>
                            </div>
                        </div>

                        <div class="estatistica">
                            <span class="estatistica-icone">▢</span>
                            <div>
                                <strong>178</strong>
                                <span>Comentários</span>
                            </div>
                        </div>

                    </div>
                </section>

    
                <section class="card posts-card"> 

                </section>

            </div>


            <aside class="coluna-lateral">

                <section class="card sobre-card">
                    <h2>Sobre mim</h2>

                    <div class="informacao-item">
                        <span class="info-icone">✉</span>
                        <div>
                            <span>Nome</span>
                            <input type="text" id="inputNome" hidden>
                            <strong id="nome"></strong>
                        </div>
                    </div>

                    <div class="informacao-item">
                        <span class="info-icone">✉</span>
                        <div>
                            <span>Email</span>
                            <input type="email" id="inputEmail" hidden>
                            <strong id="email"></strong>
                        </div>
                    </div>

                    <div class="informacao-item">
                        <span class="info-icone">⌖</span>
                        <div>
                            <span>Localização</span>
                            <strong>Brasil</strong>
                        </div>
                    </div>

                    <div class="informacao-item">
                        <span class="info-icone">↗</span>
                        <div>
                            <span>Website</span>
                            <input type="url" id="inputWebsite" hidden>
                            <strong id="website"></strong>
                        </div>
                    </div>

                    <div class="informacao-item">
                        <span class="info-icone">◉</span>
                        <div>
                            <span>GitHub</span>
                            <strong>github.com/desenvolvedor</strong>
                        </div>
                    </div>

                    <div id="mensagem"></div>
                </section>



            </aside>

        </div>

    </main>

</body>
<script src="../js/perfil.js"></script>
</html>

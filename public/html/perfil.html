
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu perfil | DevBlog</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
<a href="/"><i class="fa-solid fa-circle-left" style="color: white"></i></a>
    <main class="pagina-perfil">
        <header class="cabecalho">

            <div>
                <h1 id="titulo-perfil" data-i18n="perfil.titulo">Meu perfil</h1>
                <p data-i18n="perfil.descricao">Gerencie suas informações e acompanhe sua atividade</p>
            </div>

            <button class="botao-editar" onclick="alternarEdicaoPerfil()" type="button" data-i18n="perfil.editar_perfil">✎ Editar perfil</button>
            
        </header>
        <div class="layout-perfil">

            <div class="coluna-principal">

                <section class="card perfil-card">

                    <div class="banner-perfil"></div>

                    <div class="dados-perfil">

                        <div class="avatar-container">
                            <img
                                src="../img/fundojpg.jpg"
                                alt="Foto do perfil"
                                class="avatar"
                            >
                            <span class="status-online"></span>
                        </div>

                        <div class="perfil-texto">
                            <div>
                                <input type="text" id="inputNome" hidden>
                                <h2 id="nome"></h2>
                            </div>
                            <a href="#" id="username">@desenvolvedor.dev</a>

                            <input type="text" id="inputDescricao" hidden placeholder="Conte sobre você">

                            <p id="descricao">
                                
                            </p>

                            <div class="perfil-meta">
                                <span id="membro_desde"></span>
                                <span>⌖ Brasil</span>
                            </div>
                        </div>

                    </div>
                    <div class="estatisticas">

                        <div class="estatistica">
                            <span class="estatistica-icone">▤</span>
                            <div>
                                <strong id="qtd_post">24</strong>
                                <span>Posts</span>
                            </div>
                        </div>

                        <div class="estatistica">
                            <span class="estatistica-icone">♡</span>
                            <div>
                                <strong id="qtd_curtida">312</strong>
                                <span>Curtidas</span>
                            </div>
                        </div>

                    </div>
                </section>

    
                <section class="card posts-card"> 

                </section>

            </div>


            <aside class="coluna-lateral">

                <section class="card sobre-card">
                    <h2 id="dinamico" data-i18n="perfil.sobre_mim">Sobre mim</h2>


                    <div class="informacao-item">
                        <span class="info-icone">✉</span>
                        <div>
                            <span data-i18n="perfil.email">Email</span>
                            <input type="email" id="inputEmail" hidden>
                            <strong id="email"></strong>
                        </div>
                    </div>

                    <div class="informacao-item">
                        <span class="info-icone">⌖</span>
                        <div>
                            <span data-i18n="perfil.localização">Localização</span>
                            <strong>Brasil</strong>
                        </div>
                    </div>

                    <div class="informacao-item">
                        <span class="info-icone">↗</span>
                        <div>
                            <span data-i18n="perfil.website">Website</span>
                            <input type="url" id="inputWebsite" hidden>
                            <strong id="website"></strong>
                        </div>
                    </div>

                    <div class="informacao-item">
                        <span class="info-icone">◉</span>
                        <div>
                            <span data-i18n="perfil.github">GitHub</span>
                            <strong>github.com/desenvolvedor</strong>
                        </div>
                    </div>

                    <div id="mensagem"></div>
                </section>



            </aside>

        </div>

    </main>

</body>
<script src="https://unpkg.com/i18next/dist/umd/i18next.min.js"></script>
<script src="../js/idioma.js"></script>
<script src="../js/perfil.js" defer></script>
</html>
